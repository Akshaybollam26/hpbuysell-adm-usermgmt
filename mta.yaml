_schema-version: 3.3.0
ID: hpbuysell-adm-usermgmt
description: A simple CAP project.
version: 1.0.0
modules:
  - name: hpbuysell-adm-usermgmt-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uaa_hpbuysell-adm-usermgmt
      - name: hpbuysell-adm-usermgmt-destination-service
      - name: hpbuysell-adm-usermgmt-connectivity
      - name: ust-portfolio-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: hpbuysell-adm-usermgmt-destination-content
    type: com.sap.application.content
    requires:
      - name: hpbuysell-adm-usermgmt-destination-service
        parameters:
          content-target: true
      - name: hpbuysell-adm-usermgmt_html_repo_host
        parameters:
          service-key:
            name: hpbuysell-adm-usermgmt_html_repo_host-key
      - name: uaa_hpbuysell-adm-usermgmt
        parameters:
          service-key:
            name: uaa_hpbuysell-adm-usermgmt-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: hpbuysell-adm-usermgmt-srv-dest
              TokenServiceInstanceName: hpbuysell-adm-usermgmt-xsuaa-service
              TokenServiceKeyName: uaa_hpbuysell-adm-usermgmt-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: hpbuysell-adm-usermgmt-service
            - Authentication: OAuth2UserTokenExchange
              Name: hpbuysell-adm-usermgmt-srv-dest
              TokenServiceInstanceName: hpbuysell-adm-usermgmt-xsuaa-service
              TokenServiceKeyName: uaa_hpbuysell-adm-usermgmt-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: hpbuysell-adm-usermgmt-service
            - Name: hpbuysell-adm-common-srv-dest1
              Description: HP Buy-Sell MDM Common OData V4 Service
              URL: https://org-build-build-ai-subaccount-code-migration-space-btp-14b7b11c.cfapps.us10-001.hana.ondemand.com
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: hpbuysell-adm-usermgmt-xsuaa-service
              TokenServiceKeyName: hpbuysell-adm-usermgmt-key
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: false
              sap.cloud.service: hpbuysell-adm-usermgmt-service
            - Name: approuter_hpbuysell_adm_UserMgmt_html_repo_host
              ServiceInstanceName: hpbuysell-adm-usermgmt-html5-app-host-service
              ServiceKeyName: hpbuysell-adm-usermgmt_html_repo_host-key
              sap.cloud.service: hpbuysell-adm-usermgmt-service
            - Authentication: OAuth2UserTokenExchange
              Name: approuter_uaa_hpbuysell_adm_usermgmt
              ServiceInstanceName: hpbuysell-adm-usermgmt-xsuaa-service
              ServiceKeyName: hpbuysell-adm-usermgmt-key
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: hpbuysell-adm-usermgmt-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: hpbuysell-adm-usermgmt_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - hpbuyselladmusermgmtui.zip
          name: hpbuyselladmusermgmtui
          target-path: resources/
  - name: hpbuyselladmusermgmtui
    type: html5
    path: app/usermgmt.ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

  - name: hpbuysell-adm-usermgmt-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: ust-portfolio-db
resources:
  - name: hpbuysell-adm-usermgmt-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: hpbuysell-adm-usermgmt-destination-service
      service-plan: lite
    requires:
      - name: srv-api
  - name: hpbuysell-adm-usermgmt_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: hpbuysell-adm-usermgmt-html5-app-host-service
      service-plan: app-host
  - name: uaa_hpbuysell-adm-usermgmt
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: hpbuysell-adm-usermgmt-xsuaa-service
      service-plan: application
      config:
        xsappname: hpbuysell-adm-usermgmt-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: hpbuysell-adm-usermgmt-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: ust-portfolio-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: free

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
